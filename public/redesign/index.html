<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NarraTec — Evidenzbasierte IT-Entscheidungen</title>
<meta name="description" content="NarraTec übersetzt komplexe IT-Entscheidungen in strukturierte Narrative — evidenzbasiert, in Tagen statt Monaten, intern getragen bis ins Arbeitspaket." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* NarraTec — Editorial B2B Landing */

:root {
  --paper: oklch(98% 0.005 85);
  --paper-2: oklch(96% 0.008 85);
  --ink: oklch(18% 0.01 85);
  --ink-2: oklch(32% 0.01 85);
  --ink-3: oklch(48% 0.008 85);
  --rule: oklch(87% 0.005 85);
  --rule-strong: oklch(72% 0.008 85);
  --accent: oklch(52% 0.18 25);
  --accent-ink: oklch(38% 0.16 25);
  --accent-wash: oklch(95% 0.03 25);

  --f-display: "Instrument Serif", "Times New Roman", Georgia, serif;
  --f-sans: "Inter Tight", -apple-system, BlinkMacSystemFont, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;

  --max: 1240px;
  --gutter: clamp(20px, 4vw, 48px);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-sans);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "ss01", "cv11";
}

img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 2px;
}

::selection { background: var(--accent); color: var(--paper); }

/* ---------- Layout primitives ---------- */

.container {
  max-width: var(--max);
  margin: 0 auto;
  padding-left: var(--gutter);
  padding-right: var(--gutter);
}

.rule { border-top: 1px solid var(--rule); }
.rule-b { border-bottom: 1px solid var(--rule); }

/* ---------- Rubric marker ---------- */

.rubric {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.rubric::before {
  content: "";
  width: 18px;
  height: 1px;
  background: var(--ink-3);
}
.rubric.no-line::before { display: none; }

.rubric-num {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-3);
}

/* ---------- Display type ---------- */

.display {
  font-family: var(--f-display);
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 0.98;
  color: var(--ink);
  margin: 0;
}
.display em {
  font-style: italic;
  color: var(--accent-ink);
}

h1.display { font-size: clamp(44px, 7.4vw, 104px); }
h2.display { font-size: clamp(36px, 5.2vw, 72px); line-height: 1.02; }
h3.display { font-size: clamp(28px, 3.6vw, 44px); line-height: 1.05; }

.lede {
  font-family: var(--f-sans);
  font-size: clamp(18px, 1.5vw, 21px);
  line-height: 1.5;
  color: var(--ink-2);
  max-width: 58ch;
  font-weight: 400;
}

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  font-family: var(--f-sans);
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.005em;
  border-radius: 2px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform .12s ease, background .15s ease, border-color .15s ease;
  min-height: 48px;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.btn-primary {
  background: var(--ink);
  color: var(--paper);
}
.btn-primary:hover { background: var(--accent-ink); }

.btn-ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--rule-strong);
}
.btn-ghost:hover { border-color: var(--ink); }

.btn-arrow::after {
  content: "→";
  font-family: var(--f-mono);
  font-weight: 400;
  transition: transform .15s ease;
}
.btn:hover .btn-arrow::after,
.btn-arrow:hover::after { transform: translateX(3px); }

.linklike {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--f-sans);
  font-size: 14px;
  color: var(--ink);
  border-bottom: 1px solid var(--ink);
  padding-bottom: 2px;
  transition: color .15s, border-color .15s;
}
.linklike:hover { color: var(--accent); border-color: var(--accent); }
.linklike .arr { font-family: var(--f-mono); transition: transform .15s; }
.linklike:hover .arr { transform: translateX(3px); }

/* ---------- Nav ---------- */

.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: color-mix(in oklab, var(--paper) 88%, transparent);
  backdrop-filter: saturate(140%) blur(10px);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--rule);
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 14px 0;
}
.logo {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  font-family: var(--f-display);
  font-size: 22px;
  letter-spacing: -0.01em;
}
.logo-mark {
  display: inline-block;
  width: 10px; height: 10px;
  background: var(--accent);
  border-radius: 1px;
  transform: translateY(-1px);
}
.nav-links { display: flex; gap: 26px; align-items: center; }
.nav-link {
  font-size: 14px;
  color: var(--ink-2);
  transition: color .15s;
}
.nav-link:hover { color: var(--ink); }
.nav-cta { padding: 10px 16px; min-height: 0; font-size: 14px; }

@media (max-width: 760px) {
  .nav-links .nav-link { display: none; }
}

/* ---------- Hero ---------- */

.hero {
  padding-top: clamp(48px, 7vw, 96px);
  padding-bottom: clamp(48px, 6vw, 88px);
}
.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 380px);
  gap: clamp(32px, 4vw, 72px);
  align-items: end;
}
@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; }
}
.hero-kicker {
  display: flex;
  gap: 16px;
  align-items: center;
  margin-bottom: 28px;
}
.hero-kicker .dot {
  width: 6px; height: 6px; border-radius: 999px;
  background: var(--accent);
  box-shadow: none;
}
.hero h1 .line { display: block; }
.hero-sub {
  margin-top: 28px;
  max-width: 54ch;
}
.hero-actions {
  margin-top: 36px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.hero-meta {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 22px;
  border: 1px solid var(--rule);
  background: var(--paper-2);
  border-radius: 4px;
}
.hero-meta .stat-n {
  font-family: var(--f-display);
  font-size: 56px;
  line-height: 0.95;
  color: var(--ink);
}
.hero-meta .stat-n em { font-style: italic; color: var(--accent-ink); }
.hero-meta .stat-label {
  font-family: var(--f-sans);
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.45;
}
.hero-meta .meta-divider {
  height: 1px; background: var(--rule); margin: 4px 0;
}
.hero-meta .meta-source {
  font-family: var(--f-mono);
  font-size: 10.5px;
  color: var(--ink-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ---------- Value props strip ---------- */

.value-props {
  background: var(--ink);
  border-top: 1px solid oklch(24% 0.008 85);
  border-bottom: 1px solid oklch(24% 0.008 85);
}
.value-props-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  max-width: var(--max);
  margin: 0 auto;
  padding: 0 var(--gutter);
}
@media (max-width: 1060px) { .value-props-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 640px)  { .value-props-grid { grid-template-columns: 1fr 1fr; } }
.value-prop {
  padding: clamp(24px, 3vw, 40px) clamp(16px, 2vw, 28px);
  border-right: 1px solid oklch(26% 0.008 85);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.value-prop:last-child { border-right: none; }
@media (max-width: 1060px) {
  .value-prop:nth-child(3n) { border-right: none; }
  .value-prop { border-bottom: 1px solid oklch(26% 0.008 85); }
}
.value-prop-n {
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: .12em;
  color: var(--accent);
  text-transform: uppercase;
}
.value-prop-t {
  font-family: var(--f-display);
  font-size: clamp(16px, 1.5vw, 20px);
  line-height: 1.2;
  color: var(--paper);
  letter-spacing: -0.005em;
}
.value-prop-d {
  font-size: 13px;
  line-height: 1.65;
  color: oklch(72% 0.008 85);
  margin: 0;
}

/* ---------- Peer logos ---------- */

.peers {
  padding: 36px 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.peers-inner {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 32px;
  align-items: center;
}
@media (max-width: 760px) {
  .peers-inner { grid-template-columns: 1fr; gap: 18px; }
}
.peer-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
}
@media (max-width: 900px) { .peer-grid { grid-template-columns: repeat(3, 1fr); } }
.peer {
  padding: 14px 10px;
  border: 1px dashed var(--rule-strong);
  border-radius: 2px;
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--ink-3);
  text-align: center;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  background:
    repeating-linear-gradient(
      45deg,
      transparent 0 6px,
      color-mix(in oklab, var(--rule) 70%, transparent) 6px 7px
    );
}

/* Trust grid (methodical provenance, no logos) */
.trust-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0;
  margin: 0;
  border-left: 1px solid var(--rule);
}
@media (max-width: 900px) { .trust-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .trust-grid { grid-template-columns: 1fr; } }
.trust-item {
  padding: 14px 18px;
  border-right: 1px solid var(--rule);
}
.trust-item dt {
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 6px;
}
.trust-item dd {
  font-family: var(--f-sans);
  font-size: 14px;
  line-height: 1.35;
  color: var(--ink);
  margin: 0;
}

/* ---------- Section scaffolding ---------- */

.section {
  padding: clamp(72px, 9vw, 128px) 0;
  border-top: 1px solid var(--rule);
}
.section-head {
  display: grid;
  grid-template-columns: 180px minmax(0, 1fr);
  gap: clamp(24px, 4vw, 64px);
  margin-bottom: clamp(40px, 5vw, 72px);
  align-items: start;
}
@media (max-width: 820px) {
  .section-head { grid-template-columns: 1fr; gap: 18px; }
}
.section-head .rubric { padding-top: 6px; }
.section-head h2 { max-width: 18ch; }
.section-head .lede { margin-top: 20px; }

/* ---------- Problem patterns ---------- */

.patterns {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  border-top: 1px solid var(--rule);
}
@media (max-width: 820px) { .patterns { grid-template-columns: 1fr; } }
.pattern {
  padding: 36px 32px 40px;
  border-bottom: 1px solid var(--rule);
  border-right: 1px solid var(--rule);
  position: relative;
  background: var(--paper);
  transition: background .2s;
}
.pattern:nth-child(2n) { border-right: none; }
@media (max-width: 820px) { .pattern { border-right: none; } }
.pattern:hover { background: var(--paper-2); }
.pattern-num {
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.08em;
}
.pattern-title {
  font-family: var(--f-display);
  font-size: 32px;
  line-height: 1.05;
  margin: 10px 0 14px;
}
.pattern-body {
  color: var(--ink-2);
  max-width: 48ch;
  margin-bottom: 18px;
}
.pattern-cost {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--accent-ink);
  letter-spacing: 0.02em;
  padding: 8px 12px;
  background: var(--accent-wash);
  border-radius: 2px;
}
.pattern-cost .arrow { font-family: var(--f-mono); }

/* ---------- Method / Narrative artifact ---------- */

.method {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: clamp(24px, 4vw, 64px);
  align-items: start;
}
@media (max-width: 900px) { .method { grid-template-columns: 1fr; } }

.method-copy p { color: var(--ink-2); max-width: 48ch; margin-bottom: 18px; }
.method-steps {
  list-style: none; padding: 0; margin: 28px 0 0;
  display: flex; flex-direction: column; gap: 0;
}
.method-step {
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: 16px;
  padding: 16px 0;
  border-top: 1px solid var(--rule);
  align-items: baseline;
}
.method-step:last-child { border-bottom: 1px solid var(--rule); }
.method-step .n {
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--ink-3);
  padding-top: 2px;
}
.method-step .t { font-family: var(--f-display); font-size: 22px; }
.method-step .d { font-size: 14px; color: var(--ink-2); margin-top: 4px; }

/* Narrative document mock */
.doc {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 32px 36px;
  box-shadow:
    0 1px 0 var(--rule),
    0 24px 48px -24px oklch(18% 0.01 85 / 0.12);
  font-family: var(--f-sans);
  position: relative;
  overflow: hidden;
}
.doc::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--accent);
}
.doc-meta {
  display: flex;
  justify-content: space-between;
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  color: var(--ink-3);
  text-transform: uppercase;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--rule);
}
.doc h4 {
  font-family: var(--f-display);
  font-size: 26px;
  line-height: 1.15;
  margin: 0 0 6px;
  font-weight: 400;
}
.doc .doc-sub { font-size: 13px; color: var(--ink-3); margin-bottom: 18px; }
.doc-section {
  padding: 12px 0;
  border-top: 1px solid var(--rule);
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 16px;
}
.doc-section .k {
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding-top: 2px;
}
.doc-section .v {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.5;
}
.doc-section .v .hl {
  background: color-mix(in oklab, var(--accent-wash) 100%, transparent);
  padding: 0 3px;
  border-radius: 1px;
}
.doc-footer {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--rule);
  font-family: var(--f-mono);
  font-size: 10.5px;
  color: var(--ink-3);
  letter-spacing: 0.08em;
  display: flex;
  justify-content: space-between;
}

/* ---------- Outcomes ---------- */

.outcomes {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  border: 1px solid var(--rule);
  border-radius: 3px;
  overflow: hidden;
}
@media (max-width: 820px) { .outcomes { grid-template-columns: 1fr; } }
.outcome {
  padding: 36px 28px 32px;
  border-right: 1px solid var(--rule);
  background: var(--paper);
}
.outcome:last-child { border-right: none; }
@media (max-width: 820px) {
  .outcome { border-right: none; border-bottom: 1px solid var(--rule); }
  .outcome:last-child { border-bottom: none; }
}
.outcome-n {
  font-family: var(--f-display);
  font-size: clamp(56px, 7vw, 84px);
  line-height: 0.95;
  letter-spacing: -0.02em;
}
.outcome-n em { font-style: italic; color: var(--accent-ink); }
.outcome-n .unit {
  font-family: var(--f-sans);
  font-size: 20px;
  font-weight: 500;
  letter-spacing: 0;
  color: var(--ink-2);
  margin-left: 4px;
}
.outcome-label {
  margin-top: 16px;
  font-family: var(--f-sans);
  font-size: 15px;
  color: var(--ink);
  font-weight: 500;
}
.outcome-body {
  margin-top: 6px;
  font-size: 14px;
  color: var(--ink-2);
  max-width: 32ch;
}
.outcome-src {
  margin-top: 20px;
  font-family: var(--f-mono);
  font-size: 10.5px;
  color: var(--ink-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ---------- Use cases ---------- */

.usecases {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  border: 1px solid var(--rule);
  border-radius: 3px;
  overflow: hidden;
  background: var(--paper);
}
@media (max-width: 900px) { .usecases { grid-template-columns: 1fr; } }

.usecase {
  padding: 36px 30px 32px;
  border-right: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.usecase:last-child { border-right: none; }
@media (max-width: 900px) {
  .usecase { border-right: none; border-bottom: 1px solid var(--rule); }
  .usecase:last-child { border-bottom: none; }
}

.usecase-icon {
  width: 44px; height: 44px;
  border-radius: 6px;
  background: var(--accent-wash);
  color: var(--accent-ink);
  display: flex; align-items: center; justify-content: center;
  border: 1px solid color-mix(in oklab, var(--accent-ink) 14%, transparent);
}
.usecase-title {
  font-family: var(--f-display);
  font-size: 26px;
  line-height: 1.15;
  letter-spacing: -0.005em;
  color: var(--ink);
  margin: 0;
}
.usecase-body {
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--ink-2);
  margin: 0;
}
.usecase-outs {
  list-style: none;
  margin: auto 0 0 0;
  padding: 16px 0 0 0;
  border-top: 1px solid var(--rule);
  display: flex; flex-direction: column; gap: 10px;
}
.usecase-outs li {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--ink-2);
}
.usecase-outs .check {
  color: var(--accent-ink);
  font-weight: 600;
  flex-shrink: 0;
}

/* ---------- Team ---------- */

.team-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border: 1px solid var(--rule);
  border-radius: 3px;
  overflow: hidden;
  background: var(--paper);
}
@media (max-width: 900px) { .team-grid { grid-template-columns: 1fr; } }

.person {
  padding: 40px 36px 36px;
  border-right: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.person:last-child { border-right: none; }
@media (max-width: 900px) {
  .person { border-right: none; border-bottom: 1px solid var(--rule); }
  .person:last-child { border-bottom: none; }
}

.person-head {
  display: flex;
  align-items: center;
  gap: 20px;
}
.person-avatar {
  width: 72px; height: 72px;
  border-radius: 999px;
  background: var(--accent-wash);
  color: var(--accent-ink);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--f-display); font-size: 22px;
  letter-spacing: 0.01em;
  flex-shrink: 0;
  border: 1px solid color-mix(in oklab, var(--accent-ink) 18%, transparent);
  overflow: hidden;
}
.person-avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.person-id .person-name {
  font-family: var(--f-display);
  font-size: 24px;
  line-height: 1.15;
  color: var(--ink);

// ---------- Tweaks ----------

function Tweaks({ state, setState, visible, onClose }) {
  if (!visible) return null;
  const set = (k, v) => {
    const next = { ...state, [k]: v };
    setState(next);
    window.parent?.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };
  return (
    <div className="tweaks-panel" role="dialog" aria-label="Tweaks">
      <div className="tweaks-head">
        <span>Tweaks</span>
        <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'inherit', fontFamily: 'var(--f-mono)', fontSize: 14 }}>×</button>
      </div>
      <div className="tweaks-body">
        <div className="tweak-row">
          <label>CTA-Variante (A/B)</label>
          <div className="tweak-opts">
            {["A", "B"].map((v) =>
            <button key={v} className={"tweak-opt " + (state.ctaVariant === v ? "on" : "")} onClick={() => set('ctaVariant', v)}>
                {v} · {CTA_COPY[v].primary.split(' ').slice(0, 2).join(' ')}…
              </button>
            )}
          </div>
        </div>
        <div className="tweak-row">
          <label>Akzent-Hue ({state.accentHue}°)</label>
          <input
            type="range" min="0" max="360" step="1"
            value={state.accentHue}
            onChange={(e) => set('accentHue', +e.target.value)}
            style={{ accentColor: 'var(--accent)' }} />
          
          <div className="tweak-opts">
            {[{ n: "Tinte-Rot", v: 25 }, { n: "Waldgrün", v: 150 }, { n: "Preußisch", v: 255 }, { n: "Ocker", v: 75 }].map((p) =>
            <button key={p.v} className={"tweak-opt " + (state.accentHue === p.v ? "on" : "")} onClick={() => set('accentHue', p.v)}>{p.n}</button>
            )}
          </div>
        </div>
        <div className="tweak-note">
          A/B-Test: beide Varianten produktionsbereit. Schaltbar über Tweaks-Toggle (Toolbar).
        </div>
      </div>
    </div>);

}

// ---------- App ----------

function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = useState(TWEAK_DEFAULTS.showTweaksByDefault);

  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent?.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  useEffect(() => {
    const root = document.documentElement;
    root.style.setProperty('--accent', `oklch(52% 0.18 ${tweaks.accentHue})`);
    root.style.setProperty('--accent-ink', `oklch(38% 0.16 ${tweaks.accentHue})`);
    root.style.setProperty('--accent-wash', `oklch(95% 0.03 ${tweaks.accentHue})`);
  }, [tweaks.accentHue]);

  // reveal on scroll
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {if (e.isIntersecting) e.target.classList.add('in');});
    }, { rootMargin: '0px 0px -10% 0px' });
    document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);

  const cta = CTA_COPY[tweaks.ctaVariant] || CTA_COPY.A;

  return (
    <>
      <Nav />
      <main>
        <Hero cta={cta} />
        <Problem />
        <UseCases />
        <Position />
        <Method />
        <Disqualify />
        <Team />
        <Outcomes />
        <Case />
        <FAQ />
        <Final cta={cta} />
      </main>
      <Footer />
      <Tweaks state={tweaks} setState={setTweaks} visible={tweaksOpen} onClose={() => {
        setTweaksOpen(false);
        window.parent?.postMessage({ type: '__deactivate_edit_mode' }, '*');
      }} />
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);



</script>
