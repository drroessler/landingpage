<svg class="flow" viewBox="0 0 700 96" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Ablauf der NarraTec-Methode: Analysieren, Entscheiden, Übersetzen, Liefern — mit Rückkopplung über den Narrative Feedback Cycle">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14110D"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#BA2B2E"/>
    </marker>
  </defs>

  <g font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="1.1" fill="#605D59">

    <!-- Artefakt-Chips zwischen den Stationen -->
    <g text-anchor="middle">
      <rect x="112" y="44" width="118" height="14" fill="#F4F1EC"/>
      <text x="171" y="54" fill="#35332D">PAIN POINTS · M-T-O</text>

      <rect x="298" y="44" width="120" height="14" fill="#FFE7E4"/>
      <rect x="298" y="44" width="2.4" height="14" fill="#BA2B2E"/>
      <text x="360" y="54" fill="#83000D">NARRATIV v1.0</text>

      <rect x="466" y="44" width="156" height="14" fill="#F4F1EC"/>
      <text x="544" y="54" fill="#35332D">EPICS · FEATURES · KRITERIEN</text>
    </g>

    <!-- Achse -->
    <line x1="20" y1="30" x2="680" y2="30" stroke="#D6D4D0" stroke-width="1"/>
    <g stroke="#14110D" stroke-width="1.1" marker-end="url(#ah)">
      <line x1="91" y1="30" x2="247" y2="30"/>
      <line x1="278" y1="30" x2="433" y2="30"/>
      <line x1="464" y1="30" x2="619" y2="30"/>
    </g>

    <!-- Stationen -->
    <g text-anchor="middle">
      <circle cx="78"  cy="30" r="11" fill="#FAF8F5" stroke="#14110D" stroke-width="1.2"/>
      <text x="78"  y="33.2" font-size="8.5" fill="#14110D" letter-spacing="0.4">01</text>
      <text x="78"  y="14"   font-size="8.5" fill="#14110D">ANALYSIEREN</text>

      <circle cx="263" cy="30" r="11" fill="#FAF8F5" stroke="#14110D" stroke-width="1.2"/>
      <text x="263" y="33.2" font-size="8.5" fill="#14110D" letter-spacing="0.4">02</text>
      <text x="263" y="14"   font-size="8.5" fill="#14110D">ENTSCHEIDEN</text>

      <circle cx="449" cy="30" r="11" fill="#FAF8F5" stroke="#14110D" stroke-width="1.2"/>
      <text x="449" y="33.2" font-size="8.5" fill="#14110D" letter-spacing="0.4">03</text>
      <text x="449" y="14"   font-size="8.5" fill="#14110D">ÜBERSETZEN</text>

      <circle cx="635" cy="30" r="11" fill="#FAF8F5" stroke="#14110D" stroke-width="1.2"/>
      <text x="635" y="33.2" font-size="8.5" fill="#14110D" letter-spacing="0.4">04</text>
      <text x="635" y="14"   font-size="8.5" fill="#14110D">LIEFERN</text>
    </g>

    <!-- Rückkopplung: 04 zurück in 02 -->
    <path d="M635 43 L635 74 Q635 85 622 85 L276 85 Q263 85 263 74 L263 45"
          fill="none" stroke="#BA2B2E" stroke-width="1.3" marker-end="url(#ah-a)"/>

    <rect x="308" y="77" width="286" height="15" fill="#FAF8F5"/>
    <text x="451" y="88" font-size="8.5" fill="#83000D" text-anchor="middle" letter-spacing="1.1">
      05 &#8634; LEARNING RECORDS &#8594; NARRATIV v1.1 / v2.0
    </text>
  </g>
</svg>
